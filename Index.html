<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>此花マンション区域</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet GIS Map Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 現在地パルスアニメーション */
    .user-location-marker {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .user-location-dot {
      width: 16px;
      height: 16px;
      background-color: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
      position: relative;
    }
    .user-location-pulse {
      position: absolute;
      width: 38px;
      height: 38px;
      background-color: rgba(37, 99, 235, 0.35);
      border-radius: 50%;
      animation: pulse 2s infinite ease-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.3);
        opacity: 1;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    /* ピンマーカーのスタイリング */
    .custom-mansion-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .custom-mansion-pin:hover {
      transform: scale(1.15);
      z-index: 999 !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 2px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
    }
    .leaflet-popup-content {
      margin: 12px;
      line-height: 1.5;
    }
    /* ポップアップ内ボタンの文字色競合を強制防止 */
    .leaflet-popup-content a.room-link-btn,
    .leaflet-popup-content a.room-link-btn * {
      color: #ffffff !important;
      text-decoration: none !important;
    }
  </style>
</head>
<body class="bg-slate-100 flex flex-col h-screen select-none">

  <!-- 上部ヘッダー -->
  <header class="bg-blue-950 text-white px-3 sm:px-4 py-2.5 flex flex-col gap-2 shadow-lg z-10 shrink-0 relative border-b border-blue-900/60">
    <!-- 1行目：タイトル（左） ＆ 操作ボタン（右：現在地 ＋ ハンバーガー） -->
    <div class="flex items-center justify-between w-full gap-2">
      <div class="flex items-center space-x-2.5 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shadow-md border border-blue-400/30">
          <i class="fas fa-building text-sm"></i>
        </div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white whitespace-nowrap">此花マンション区域</h1>
      </div>

      <!-- 右端：現在地ボタン ＆ ハンバーガーメニュー -->
      <div id="headerControls" class="hidden flex items-center justify-end gap-1.5">
        <button onclick="moveToCurrentLocation()" class="p-2 bg-blue-900/80 hover:bg-blue-800 active:bg-blue-700 text-blue-100 hover:text-white rounded-xl text-xs transition flex items-center justify-center border border-blue-700/60 shadow-sm" title="現在地に移動">
          <i class="fas fa-location-crosshairs text-sm"></i>
        </button>
        <button id="btnHamburger" onclick="toggleHamburgerMenu(event)" class="p-2 bg-blue-900/80 hover:bg-blue-800 active:bg-blue-700 text-blue-100 hover:text-white rounded-xl text-xs transition flex items-center justify-center border border-blue-700/60 shadow-sm" title="メニュー">
          <i class="fas fa-bars text-sm"></i>
        </button>
      </div>
    </div>

    <!-- ハンバーガーメニュー ドロップダウン -->
    <div id="hamburgerDropdown" class="hidden absolute right-3 top-13 z-50 bg-white text-slate-800 border border-slate-200 rounded-2xl shadow-2xl p-1.5 w-36 flex flex-col gap-1 backdrop-blur-md">
      <button onclick="openReportModal()" class="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-700 rounded-xl flex items-center gap-2 transition font-semibold">
        <i class="fas fa-pen-to-square text-blue-600 w-4"></i>
        <span>報告</span>
      </button>
      <div class="h-px bg-slate-100 my-0.5"></div>
      <button onclick="logout()" class="w-full text-left px-3 py-2 text-xs text-red-600 hover:bg-red-50 rounded-xl flex items-center gap-2 transition font-semibold">
        <i class="fas fa-sign-out-alt text-red-500 w-4"></i>
        <span>ログアウト</span>
      </button>
    </div>

    <!-- 2行目：エリアフィルター（左） ＋ マンション一覧切り替えボタン（右） -->
    <div id="headerAreaFilter" class="hidden items-center justify-between bg-blue-900/80 p-1.5 rounded-xl border border-blue-700/50 gap-1.5 w-full shadow-inner">
      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar flex-1">
        <button onclick="setAreaFilter('ALL')" id="header-tab-ALL" class="header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-blue-950 shadow-md whitespace-nowrap text-center">
          すべて
        </button>
        <button onclick="setAreaFilter('此花区')" id="header-tab-此花区" class="header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-blue-200 hover:text-white hover:bg-white/10 whitespace-nowrap text-center">
          此花区
        </button>
        <button onclick="setAreaFilter('福島区')" id="header-tab-福島区" class="header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-blue-200 hover:text-white hover:bg-white/10 whitespace-nowrap text-center">
          福島区
        </button>
        <button onclick="setAreaFilter('急ぎ・優先')" id="header-tab-急ぎ・優先" class="header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-amber-300 hover:text-amber-200 hover:bg-white/10 whitespace-nowrap text-center">
          急ぎ・優先
        </button>
      </div>

      <div class="w-px h-4 bg-blue-700/50 shrink-0 mx-0.5"></div>

      <!-- 右端：一覧/地図ドロワー切り替えボタン -->
      <button onclick="toggleMansionListDrawer()" id="btnList" class="header-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white bg-blue-600 hover:bg-blue-500 active:bg-blue-700 whitespace-nowrap text-center shrink-0 border border-blue-400/40 shadow-sm flex items-center gap-1.5">
        <i class="fas fa-list text-[11px]"></i>
        <span>一覧</span>
      </button>
    </div>
  </header>

  <!-- ログイン画面 -->
  <div id="loginScreen" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md border border-slate-100">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl mb-3 border border-blue-100">
          <i class="fas fa-shield-halved text-2xl"></i>
        </div>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">此花マンション区域</h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">アクセスパスワードを入力してください</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">パスワード</label>
          <div class="relative">
            <input type="password" id="passwordInput" required placeholder="••••••••" autocomplete="current-password"
              class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-800 text-base">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
              <i id="eyeIcon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div id="loginError" class="hidden text-red-600 text-xs text-center bg-red-50 py-2.5 rounded-lg border border-red-200 flex items-center justify-center gap-1.5">
          <i class="fas fa-exclamation-circle"></i>
          <span>パスワードが正しくありません</span>
        </div>

        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition duration-200 flex items-center justify-center gap-2">
          <span>ログイン</span>
          <i class="fas fa-arrow-right text-sm"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- メイン表示領域 -->
  <main class="flex-1 relative overflow-hidden">
    <div id="map"></div>

    <!-- ステータス表示（Toast） -->
    <div id="statusToast" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg backdrop-blur-sm flex items-center gap-2 transition-all duration-300 pointer-events-none opacity-0">
      <i id="statusSpinner" class="fas fa-circle-notch fa-spin text-blue-400"></i>
      <span id="statusText">データを読み込んでいます...</span>
    </div>

    <!-- マンション一覧ドロワー -->
    <div id="listDrawer" class="absolute top-0 right-0 h-full w-full sm:w-80 bg-white/95 backdrop-blur-md shadow-2xl z-30 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-slate-200">
      <div class="p-4 bg-blue-600 text-white flex items-center justify-between">
        <h3 class="font-bold text-sm flex items-center gap-2">
          <i class="fas fa-building text-blue-200"></i>
          <span>登録マンション一覧</span>
        </h3>
        <button onclick="toggleMansionListDrawer()" class="text-blue-100 hover:text-white p-1">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- 検索窓 ＆ 該当数・更新エリア -->
      <div class="p-3 bg-slate-50/90 border-b border-slate-200 flex flex-col gap-2 shrink-0">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="mansionSearchInput" oninput="handleSearchInput()" placeholder="マンション名・住所・エリアで検索..." class="w-full pl-8 pr-3 py-2 text-xs bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-700 shadow-sm">
        </div>
        <div class="flex items-center justify-between text-xs text-slate-600 px-1 pt-0.5">
          <div>該当数: <span id="mansionSearchCount" class="font-bold text-slate-900">0</span> 件</div>
          <button onclick="loadMansionData()" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1 transition">
            <i class="fas fa-sync-alt text-xs"></i>
            <span>更新</span>
          </button>
        </div>
      </div>

      <div id="drawerContent" class="flex-1 overflow-y-auto p-3 space-y-2">
        <!-- JSで動的挿入 -->
      </div>
    </div>
  </main>

  <!-- 報告モーダルダイアログ -->
  <div id="reportModal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-200">
      <!-- モーダルヘッダー -->
      <div class="p-5 sm:p-6 pb-2 flex items-center justify-between">
        <div class="flex items-center gap-2 text-slate-800 font-bold text-lg sm:text-xl">
          <i class="fas fa-pen-to-square text-blue-600"></i>
          <span>報告</span>
        </div>
        <button type="button" onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition">
          <i class="fas fa-times text-lg"></i>
        </button>
      </div>

      <!-- モーダルフォーム -->
      <form onsubmit="handleReportSubmit(event)" class="p-5 sm:p-6 pt-3 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">
            奉仕者名 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="reportName" required placeholder="奉仕者名を入力" class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-800 placeholder-slate-400 shadow-sm transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">
            項目を選択 <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <select id="reportCategory" onchange="handleReportCategoryChange()" required class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-800 appearance-none shadow-sm transition cursor-pointer pr-10">
              <option value="" disabled selected>▼ 選択してください</option>
              <option value="新規マンション追加">新規マンション追加</option>
              <option value="登録情報の修正">登録情報の修正</option>
              <option value="訪問拒否情報">訪問拒否情報</option>
              <option value="外国人情報">外国人情報</option>
              <option value="その他">その他</option>
            </select>
            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-xs">
              <i class="fas fa-chevron-down"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">
            詳細内容
          </label>
          <textarea id="reportDetails" rows="3" placeholder="詳細を入力" class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-800 placeholder-slate-400 shadow-sm transition resize-none"></textarea>
        </div>

        <button type="submit" id="reportSubmitBtn" class="w-full mt-2 py-3.5 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-sm">
          <i class="fas fa-paper-plane text-xs"></i>
          <span>送信</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const CORRECT_PASSWORD = "konohana";
    let map = null;
    let userMarker = null;
    let mansionMarkers = [];
    let mansionDataList = [];
    let watchPositionId = null;
    let userCoordinates = null;
    let currentAreaFilter = 'ALL';
    let searchKeyword = '';

    // カラーパレット定義（16シート識別用）
    const sheetColors = [
      { bg: '#2563eb', text: '#ffffff', badgeBg: '#dbeafe', badgeText: '#1e40af' },
      { bg: '#dc2626', text: '#ffffff', badgeBg: '#fee2e2', badgeText: '#991b1b' },
      { bg: '#059669', text: '#ffffff', badgeBg: '#d1fae5', badgeText: '#065f46' },
      { bg: '#d97706', text: '#ffffff', badgeBg: '#fef3c7', badgeText: '#92400e' },
      { bg: '#7c3aed', text: '#ffffff', badgeBg: '#ede9fe', badgeText: '#5b21b6' },
      { bg: '#db2777', text: '#ffffff', badgeBg: '#fce7f3', badgeText: '#9d174d' },
      { bg: '#0891b2', text: '#ffffff', badgeBg: '#cffaff', badgeText: '#155e75' },
      { bg: '#65a30d', text: '#ffffff', badgeBg: '#ecfccb', badgeText: '#3f6212' },
      { bg: '#ea580c', text: '#ffffff', badgeBg: '#ffedd5', badgeText: '#9a3412' },
      { bg: '#4f46e5', text: '#ffffff', badgeBg: '#e0e7ff', badgeText: '#3730a3' },
      { bg: '#0284c7', text: '#ffffff', badgeBg: '#e0f2fe', badgeText: '#075985' },
      { bg: '#16a34a', text: '#ffffff', badgeBg: '#dcfce7', badgeText: '#166534' },
      { bg: '#9333ea', text: '#ffffff', badgeBg: '#f3e8ff', badgeText: '#6b21a8' },
      { bg: '#c026d3', text: '#ffffff', badgeBg: '#fae8ff', badgeText: '#86198f' },
      { bg: '#e11d48', text: '#ffffff', badgeBg: '#ffe4e6', badgeText: '#9f1239' },
      { bg: '#475569', text: '#ffffff', badgeBg: '#f1f5f9', badgeText: '#334155' }
    ];
    const sheetColorMap = {};
    let colorIndex = 0;

    function getSheetColor(sheetName) {
      if (!sheetName) sheetName = 'その他';
      if (!sheetColorMap[sheetName]) {
        sheetColorMap[sheetName] = sheetColors[colorIndex % sheetColors.length];
        colorIndex++;
      }
      return sheetColorMap[sheetName];
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      const pwdInput = document.getElementById("passwordInput");
      const errDiv = document.getElementById("loginError");

      if (pwdInput.value === CORRECT_PASSWORD) {
        document.getElementById("loginScreen").classList.add("hidden");
        
        const controls = document.getElementById("headerControls");
        const areaFilter = document.getElementById("headerAreaFilter");
        if (controls) {
          controls.classList.remove("hidden");
          controls.classList.add("flex");
        }
        if (areaFilter) {
          areaFilter.classList.remove("hidden");
          areaFilter.classList.add("flex");
        }

        setTimeout(() => {
          initMap();
          if (map) map.invalidateSize();
          loadMansionData();
          startLocationTracking();
        }, 100);
      } else {
        if (errDiv) errDiv.classList.remove("hidden");
      }
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById("passwordInput");
      const eyeIcon = document.getElementById("eyeIcon");
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
      } else {
        pwdInput.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
    }

    function logout() {
      closeHamburgerMenu();
      document.getElementById("passwordInput").value = "";
      document.getElementById("loginError").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("headerControls").classList.add("hidden");
      document.getElementById("headerAreaFilter").classList.add("hidden");
    }

    function toggleHamburgerMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById("hamburgerDropdown");
      if (menu) menu.classList.toggle("hidden");
    }

    function closeHamburgerMenu() {
      const menu = document.getElementById("hamburgerDropdown");
      if (menu && !menu.classList.contains("hidden")) {
        menu.classList.add("hidden");
      }
    }

    window.addEventListener('click', (e) => {
      const btn = document.getElementById("btnHamburger");
      const dropdown = document.getElementById("hamburgerDropdown");
      if (dropdown && !dropdown.classList.contains("hidden") && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
        closeHamburgerMenu();
      }
    });

    function openReportModal() {
      closeHamburgerMenu();
      const modal = document.getElementById("reportModal");
      if (modal) modal.classList.remove("hidden");
    }

    function closeReportModal() {
      const modal = document.getElementById("reportModal");
      if (modal) modal.classList.add("hidden");
    }

    function handleReportCategoryChange() {
      const category = document.getElementById("reportCategory").value;
      const detailsInput = document.getElementById("reportDetails");
      if (!detailsInput) return;

      if (category === "新規マンション追加") {
        detailsInput.placeholder = "住所・マンション名・部屋番号を入力";
      } else {
        detailsInput.placeholder = "詳細を入力";
      }
    }

    function handleReportSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("reportSubmitBtn");
      const name = document.getElementById("reportName").value.trim();
      const category = document.getElementById("reportCategory").value;
      const details = document.getElementById("reportDetails").value.trim();

      if (!name || !category) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fas fa-circle-notch fa-spin text-xs"></i> <span>送信中...</span>`;

      const reportData = { reporterName: name, category: category, details: details, location: '' };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fas fa-paper-plane text-xs"></i> <span>送信</span>`;
            if (res && res.success) {
              closeReportModal();
              showToast("報告を送信しました", false);
              document.getElementById("reportName").value = "";
              document.getElementById("reportCategory").value = "";
              document.getElementById("reportDetails").value = "";
              document.getElementById("reportDetails").placeholder = "詳細を入力";
            } else {
              showToast("送信失敗: " + (res ? res.error : "エラーが発生しました"), false);
            }
          })
          .withFailureHandler((err) => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fas fa-paper-plane text-xs"></i> <span>送信</span>`;
            showToast("通信エラー: " + (err.message || err.toString()), false);
          })
          .submitReport(reportData);
      } else {
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fas fa-paper-plane text-xs"></i> <span>送信</span>`;
          closeReportModal();
          showToast("報告を送信しました（テスト動作）", false);
        }, 800);
      }
    }

    function initMap() {
      if (map) return;
      map = L.map('map', { zoomControl: false }).setView([34.682, 135.452], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);
    }

    function loadMansionData() {
      showToast("データを読み込んでいます...", true);

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onDataLoaded)
          .withFailureHandler(onDataError)
          .getMansionData();
      } else {
        // テスト環境フォールバック
        setTimeout(() => {
          onDataLoaded({
            success: true,
            data: [
              { id: 1, name: "サンプルプレサンス此花 (急ぎ)", address: "大阪市此花区四貫島1-1", roomLink: "https://example.com", lat: 34.682, lng: 135.452, sheetName: "フロタン" },
              { id: 2, name: "福島グランドハイツ", address: "大阪市福島区海老江2-1", roomLink: "https://example.com", lat: 34.690, lng: 135.465, sheetName: "海老江" }
            ]
          });
        }, 800);
      }
    }

    function onDataError(err) {
      console.error("GAS Execution Error: ", err);
      showToast("通信エラー: " + (err.message || err.toString()), false);
    }

    function onDataLoaded(res) {
      if (!res || !res.success) {
        showToast("データ取得失敗: " + (res ? res.error : "不明なエラー"), false);
        return;
      }

      mansionDataList = res.data;
      renderMarkers();
      renderDrawerList();
      showToast(`${mansionDataList.length}件のマンションを取得しました`, false);
    }

    function handleSearchInput() {
      const input = document.getElementById("mansionSearchInput");
      searchKeyword = input ? input.value.trim().toLowerCase() : '';
      renderMarkers();
      renderDrawerList();
    }

    function getMansionArea(m) {
      if (m.address && m.address.includes('此花区')) return '此花区';
      if (m.address && m.address.includes('福島区')) return '福島区';
      if (m.sheetName && m.sheetName.includes('海老江')) return '福島区';
      return 'その他';
    }

    function getFilteredMansionList() {
      let list = mansionDataList;

      if (currentAreaFilter === '急ぎ・優先') {
        list = list.filter(m => m.name && (m.name.includes('急ぎ') || m.name.includes('優先')));
      } else if (currentAreaFilter !== 'ALL') {
        list = list.filter(m => getMansionArea(m) === currentAreaFilter);
      }

      if (searchKeyword) {
        list = list.filter(m => {
          const name = (m.name || '').toLowerCase();
          const addr = (m.address || '').toLowerCase();
          const sheet = (m.sheetName || '').toLowerCase();
          const area = (getMansionArea(m) || '').toLowerCase();
          return name.includes(searchKeyword) || addr.includes(searchKeyword) || sheet.includes(searchKeyword) || area.includes(searchKeyword);
        });
      }

      return list;
    }

    function setAreaFilter(area) {
      currentAreaFilter = area;
      updateFilterUI();
      renderMarkers();
      renderDrawerList();
    }

    function updateFilterUI() {
      const filters = ['ALL', '此花区', '福島区', '急ぎ・優先'];
      filters.forEach(f => {
        const btn = document.getElementById(`header-tab-${f}`);
        if (!btn) return;
        if (f === currentAreaFilter) {
          if (f === '急ぎ・優先') {
            btn.className = "header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-amber-400 text-slate-950 shadow-md whitespace-nowrap text-center";
          } else {
            btn.className = "header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-blue-950 shadow-md whitespace-nowrap text-center";
          }
        } else {
          if (f === '急ぎ・優先') {
            btn.className = "header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-amber-300 hover:text-amber-200 hover:bg-white/10 whitespace-nowrap text-center";
          } else {
            btn.className = "header-filter-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-blue-200 hover:text-white hover:bg-white/10 whitespace-nowrap text-center";
          }
        }
      });
    }

    function renderMarkers() {
      if (!map) return;
      mansionMarkers.forEach(m => map.removeLayer(m));
      mansionMarkers = [];

      const filteredList = getFilteredMansionList();

      filteredList.forEach(m => {
        const color = getSheetColor(m.sheetName);

        const pinHtml = `
          <div class="custom-mansion-pin">
            <div style="background-color: ${color.bg}; color: ${color.text}; width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #ffffff;">
              <i class="fas fa-building" style="transform: rotate(45deg); font-size: 13px;"></i>
            </div>
          </div>
        `;

        const customIcon = L.divIcon({
          className: 'mansion-pin-icon',
          html: pinHtml,
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -32]
        });

        const roomBtn = m.roomLink && m.roomLink.length > 5
          ? `<a href="${m.roomLink}" target="_blank" rel="noopener noreferrer" class="room-link-btn mt-2.5 inline-flex items-center justify-center w-full px-3 py-2 bg-blue-600 hover:bg-blue-700 !text-white font-bold rounded-lg text-xs transition shadow-sm gap-1.5 no-underline" style="color: #ffffff !important;">
              <span style="color: #ffffff !important;">部屋番号一覧を見る</span>
              <i class="fas fa-external-link-alt text-[10px]" style="color: #ffffff !important;"></i>
             </a>`
          : `<div class="mt-2 text-xs text-slate-400 italic">リンク未登録</div>`;

        const popupContent = `
          <div class="p-1 min-w-[200px]">
            <div class="mb-1 flex items-center gap-1">
              <span style="background-color: ${color.badgeBg}; color: ${color.badgeText};" class="px-2 py-0.5 rounded-full text-[10px] font-bold inline-block">
                ${m.sheetName}
              </span>
              <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-[10px] font-bold inline-block border border-slate-200">
                ${getMansionArea(m)}
              </span>
            </div>
            <h4 class="font-bold text-slate-900 text-sm border-b pb-1 mb-1 border-slate-200">${m.name}</h4>
            <p class="text-xs text-slate-600 flex items-start gap-1 my-1">
              <i class="fas fa-location-dot text-slate-400 mt-0.5 shrink-0"></i>
              <span>${m.address || '住所未登録'}</span>
            </p>
            ${roomBtn}
          </div>
        `;

        const marker = L.marker([m.lat, m.lng], { icon: customIcon }).addTo(map);
        marker.bindPopup(popupContent);
        mansionMarkers.push(marker);
      });
    }

    function renderDrawerList() {
      const container = document.getElementById("drawerContent");
      if (!container) return;
      container.innerHTML = "";

      const filteredList = getFilteredMansionList();

      const countEl = document.getElementById("mansionSearchCount");
      if (countEl) countEl.textContent = filteredList.length;

      if (filteredList.length === 0) {
        container.innerHTML = `<div class="text-center text-xs text-slate-400 py-8">該当するマンションが見つかりません</div>`;
        return;
      }

      filteredList.forEach(m => {
        const color = getSheetColor(m.sheetName);
        const areaName = getMansionArea(m);
        const card = document.createElement("div");
        card.className = "p-3 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 cursor-pointer transition shadow-sm";
        card.onclick = () => {
          toggleMansionListDrawer();
          if (map) map.setView([m.lat, m.lng], 17);
          const index = filteredList.findIndex(item => item.id === m.id);
          if (index !== -1 && mansionMarkers[index]) {
            mansionMarkers[index].openPopup();
          }
        };

        card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-1">
              <span style="background-color: ${color.badgeBg}; color: ${color.badgeText};" class="px-2 py-0.5 rounded-full text-[10px] font-bold">
                ${m.sheetName}
              </span>
              <span class="bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded-full text-[9px] font-semibold">
                ${areaName}
              </span>
            </div>
            <i class="fas fa-chevron-right text-xs text-slate-400"></i>
          </div>
          <div class="font-bold text-slate-800 text-xs mb-1">${m.name}</div>
          <div class="text-[11px] text-slate-500 truncate">${m.address || '住所未指定'}</div>
        `;

        container.appendChild(card);
      });
    }

    function startLocationTracking() {
      if (!navigator.geolocation) {
        showToast("お使いの端末はGPSに対応していません", false);
        return;
      }

      watchPositionId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          userCoordinates = [lat, lng];

          if (!userMarker && map) {
            const userIcon = L.divIcon({
              className: 'user-location-marker',
              html: `<div class="user-location-pulse"></div><div class="user-location-dot"></div>`,
              iconSize: [38, 38],
              iconAnchor: [19, 19]
            });

            userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
            userMarker.bindPopup("<b>あなたの現在地</b>");
          } else if (userMarker) {
            userMarker.setLatLng([lat, lng]);
          }
        },
        (err) => {
          console.warn("GPS Location error: ", err);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 2000
        }
      );
    }

    function toggleMansionListDrawer() {
      const drawer = document.getElementById("listDrawer");
      const btnList = document.getElementById("btnList");
      if (!drawer) return;

      drawer.classList.toggle("translate-x-full");
      const isOpen = !drawer.classList.contains("translate-x-full");

      if (btnList) {
        if (isOpen) {
          btnList.innerHTML = `<i class="fas fa-map text-[11px]"></i><span>地図</span>`;
          btnList.className = "header-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-blue-950 bg-white hover:bg-blue-50 whitespace-nowrap text-center shrink-0 border border-white shadow-md flex items-center gap-1.5";
        } else {
          btnList.innerHTML = `<i class="fas fa-list text-[11px]"></i><span>一覧</span>`;
          btnList.className = "header-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-white bg-blue-600 hover:bg-blue-500 whitespace-nowrap text-center shrink-0 border border-blue-400/40 shadow-sm flex items-center gap-1.5";
        }
      }
    }

    function moveToCurrentLocation() {
      if (userCoordinates && map) {
        map.setView(userCoordinates, 17);
        if (userMarker) {
          userMarker.openPopup();
        }
        showToast("現在地に移動しました", false);
      } else {
        showToast("現在地を取得中、またはGPSが不許可です", false);
      }
    }

    function showToast(message, isSpinning = false) {
      const toast = document.getElementById("statusToast");
      const text = document.getElementById("statusText");
      const spinner = document.getElementById("statusSpinner");

      if (!toast || !text) return;

      text.textContent = message;
      if (spinner) {
        if (isSpinning) spinner.classList.remove("hidden");
        else spinner.classList.add("hidden");
      }

      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");

      if (!isSpinning) {
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 3000);
      }
    }
  </script>
</body>
</html>
