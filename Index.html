<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>此花マンション区域</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet GIS Map Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .btn-touch-ui {
      user-select: none;
      -webkit-user-select: none;
    }

    /* 現在地パルスアニメーション */
    .user-location-marker {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .user-location-dot {
      width: 16px;
      height: 16px;
      background-color: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
      position: relative;
    }
    .user-location-pulse {
      position: absolute;
      width: 38px;
      height: 38px;
      background-color: rgba(37, 99, 235, 0.35);
      border-radius: 50%;
      animation: pulse 2s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* ピンマーカーのスタイリング */
    .custom-mansion-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .custom-mansion-pin:hover {
      transform: scale(1.15);
      z-index: 999 !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 24px;
      padding: 14px 16px !important;
      box-shadow: 0 12px 28px -5px rgba(0, 0, 0, 0.22);
      max-width: calc(100vw - 40px) !important;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.5;
    }
    .leaflet-popup-content .popup-inner-wrapper {
      margin-bottom: 4px;
      padding-bottom: 4px;
    }
    /* ポップアップ内「✕」ボタンの位置とスタイリング調整 */
    .leaflet-container a.leaflet-popup-close-button {
      top: 12px !important;
      right: 12px !important;
      padding: 4px !important;
      color: #64748b !important;
      font-size: 16px !important;
      width: 26px !important;
      height: 26px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 50% !important;
      background-color: transparent !important;
      transition: background-color 0.2s ease, color 0.2s ease !important;
    }
    .leaflet-container a.leaflet-popup-close-button:hover {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }

    /* 急ぎ・優先ピンの波紋アニメーション */
    .urgent-pin-pulse {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.45);
      animation: urgentPulse 1.8s infinite ease-out;
      pointer-events: none;
    }

    @keyframes urgentPulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 flex flex-col h-[100dvh]">

  <!-- 上部ヘッダー（クリーンホワイト ＋ エメラルドグリーン） -->
  <header class="bg-white text-slate-800 px-3.5 sm:px-4 pt-3 pb-2.5 flex flex-col gap-2.5 shadow-sm z-[9999] shrink-0 relative border-b border-slate-100 btn-touch-ui">
    <!-- 1行目：タイトル（左） ＆ 操作ボタン（右：現在地 ＋ ハンバーガー） -->
    <div class="flex items-center justify-between w-full gap-2">
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-9 h-9 rounded-xl bg-[#13685e] flex items-center justify-center text-white shadow-sm shrink-0">
          <i class="fas fa-building text-base"></i>
        </div>
        <div class="flex flex-col shrink-0">
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-800 whitespace-nowrap leading-tight">此花マンション区域</h1>
        </div>
      </div>

      <!-- 右端：現在地ボタン ＆ ハンバーガーメニュー -->
      <div id="headerControls" class="hidden flex items-center justify-end gap-2">
        <button onclick="moveToCurrentLocation()" aria-label="現在地に移動" title="現在地に移動"
          class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 active:bg-slate-200 rounded-xl text-base transition flex items-center justify-center w-10 h-10 border border-slate-200 bg-white shadow-sm">
          <i class="fas fa-crosshairs"></i>
        </button>
        <button id="btnHamburger" onclick="toggleHamburgerMenu(event)" aria-label="メニューを開く" title="メニュー"
          class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 active:bg-slate-200 rounded-xl text-base transition flex items-center justify-center w-10 h-10 border border-slate-200 bg-white shadow-sm">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>

    <!-- ハンバーガーメニュー ドロップダウン -->
    <div id="hamburgerDropdown" class="hidden absolute right-3 top-16 z-[10000] bg-white text-slate-800 border border-slate-200 rounded-2xl shadow-xl p-1.5 w-40 flex flex-col gap-1 backdrop-blur-md">
      <button onclick="openReportModal()" class="w-full text-left px-3.5 py-2.5 text-xs text-slate-700 hover:bg-slate-100 hover:text-slate-900 rounded-xl flex items-center gap-2 transition font-semibold">
        <i class="fas fa-pen-to-square text-emerald-600 w-4"></i>
        <span>報告</span>
      </button>
      <div class="h-px bg-slate-100 my-0.5"></div>
      <button onclick="logout()" class="w-full text-left px-3.5 py-2.5 text-xs text-red-500 hover:bg-red-50 rounded-xl flex items-center gap-2 transition font-semibold">
        <i class="fas fa-sign-out-alt text-red-500 w-4"></i>
        <span>ログアウト</span>
      </button>
    </div>

    <!-- 2行目：エリアフィルター（カプセル・ピル型タブ ＆ 右端グラデーションガイド） -->
    <div id="headerAreaFilter" class="hidden items-center justify-between gap-1 w-full pt-0.5 relative">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar flex-1 pb-0.5 pr-6">
        <button onclick="setAreaFilter('ALL')" id="header-tab-ALL" class="header-filter-btn px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-white bg-[#1e293b] shadow-sm whitespace-nowrap text-center shrink-0">
          すべて <span id="count-ALL" class="opacity-80 ml-0.5 text-[10px] sm:text-[11px]">(0)</span>
        </button>
        <button onclick="setAreaFilter('此花区')" id="header-tab-此花区" class="header-filter-btn px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-semibold transition-all text-slate-600 bg-[#edf2f4] hover:bg-slate-200 whitespace-nowrap text-center shrink-0">
          <span class="inline-block w-2 h-2 rounded-full mr-0.5 sm:mr-1 align-middle ring-1 ring-white/70" style="background-color:#2563eb;"></span>此花区 <span id="count-此花区" class="opacity-80 ml-0.5 text-[10px] sm:text-[11px]">(0)</span>
        </button>
        <button onclick="setAreaFilter('福島区')" id="header-tab-福島区" class="header-filter-btn px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-semibold transition-all text-slate-600 bg-[#edf2f4] hover:bg-slate-200 whitespace-nowrap text-center shrink-0">
          <span class="inline-block w-2 h-2 rounded-full mr-0.5 sm:mr-1 align-middle ring-1 ring-white/70" style="background-color:#7c3aed;"></span>福島区 <span id="count-福島区" class="opacity-80 ml-0.5 text-[10px] sm:text-[11px]">(0)</span>
        </button>
        <button onclick="setAreaFilter('急ぎ・優先')" id="header-tab-急ぎ・優先" class="header-filter-btn px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-[#854d0e] bg-[#fef3c7] hover:bg-[#fde68a] whitespace-nowrap text-center shrink-0 flex items-center gap-1">
          <i class="fas fa-fire text-[#854d0e] text-[10px] sm:text-[11px]"></i>
          <span>急ぎ<span class="hidden sm:inline">・優先</span> <span id="count-急ぎ・優先" class="opacity-90 ml-0.5 text-[10px] sm:text-[11px]">(0)</span></span>
        </button>
        <button onclick="toggleNearMode()" id="header-tab-NEAR" class="px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-sky-800 bg-sky-50 border border-sky-200 whitespace-nowrap text-center shrink-0 flex items-center gap-1">
          <i class="fas fa-location-arrow text-[10px] sm:text-[11px]"></i>
          <span>近く<span class="hidden sm:inline">500m</span></span>
        </button>
      </div>

      <!-- 右端のスクロール誘導フェード（グラデーション影） -->
      <div class="absolute right-0 top-0 bottom-0 w-7 bg-gradient-to-l from-white via-white/80 to-transparent pointer-events-none flex items-center justify-end pr-0.5 text-slate-400 text-[10px]">
        <i class="fas fa-chevron-right opacity-60 animate-pulse"></i>
      </div>
    </div>
  </header>

  <!-- ログイン画面 -->
  <div id="loginScreen" class="fixed inset-0 z-[10001] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 btn-touch-ui">
    <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-md border border-slate-100">
      <div class="text-center mb-6">
        <div class="flex items-center justify-center gap-2.5 mb-2">
          <div class="w-10 h-10 bg-emerald-50 text-[#13685e] rounded-2xl flex items-center justify-center border border-emerald-100 shadow-sm shrink-0">
            <i class="fas fa-building text-xl"></i>
          </div>
          <h2 class="text-xl sm:text-2xl font-bold text-slate-800">此花マンション区域</h2>
        </div>
        <p class="text-xs sm:text-sm text-slate-500">パスワードを入力してください</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="passwordInput" class="block text-xs font-semibold text-slate-600 mb-1">パスワード</label>
          <div class="relative">
            <input type="password" id="passwordInput" required placeholder="••••••••" autocomplete="current-password"
              class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#13685e] focus:border-transparent text-slate-800 text-base">
            <button type="button" onclick="togglePasswordVisibility()" aria-label="パスワードの表示切替" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-2">
              <i id="eyeIcon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div id="loginError" class="hidden text-red-600 text-xs text-center bg-red-50 py-2.5 rounded-lg border border-red-200 flex items-center justify-center gap-1.5">
          <i class="fas fa-exclamation-circle"></i>
          <span id="loginErrorMsg">パスワードが正しくありません</span>
        </div>

        <button type="submit" id="btnLoginSubmit" class="w-full py-3.5 bg-[#13685e] hover:bg-[#0e524a] active:bg-[#0a3f39] text-white font-bold rounded-2xl shadow-lg shadow-emerald-900/20 transition duration-200 flex items-center justify-center gap-2">
          <span id="loginBtnText">ログイン</span>
          <i class="fas fa-arrow-right text-sm"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- メイン表示領域 -->
  <main class="flex-1 relative overflow-hidden">
    <div id="map"></div>

    <!-- フローティング「一覧」切り替えボタン -->
    <div class="absolute top-4 right-4 z-20 btn-touch-ui">
      <button onclick="toggleMansionListDrawer()" id="btnList" aria-label="マンション一覧を開く" class="px-4 py-2.5 rounded-full text-xs font-bold transition-all text-white bg-[#13685e] hover:bg-[#0e524a] active:bg-[#0a3f39] whitespace-nowrap text-center shrink-0 shadow-lg border border-white/20 flex items-center justify-center gap-1.5">
        <i class="fas fa-list text-xs"></i>
        <span>一覧</span>
      </button>
    </div>

    <!-- ステータス表示（Toast） -->
    <div id="statusToast" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg backdrop-blur-sm flex items-center gap-2 transition-all duration-300 pointer-events-none opacity-0">
      <i id="statusSpinner" class="fas fa-circle-notch fa-spin text-blue-400"></i>
      <span id="statusText">データを読み込んでいます...</span>
    </div>

    <!-- マンション一覧ドロワー -->
    <div id="listDrawer" class="absolute top-0 right-0 h-full w-full sm:w-80 bg-white/95 backdrop-blur-md shadow-2xl z-30 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-slate-200">
      <div class="p-4 bg-[#13685e] text-white flex items-center justify-between btn-touch-ui">
        <h3 class="font-bold text-sm flex items-center gap-2">
          <i class="fas fa-building text-emerald-200"></i>
          <span>マンション一覧</span>
        </h3>
        <button onclick="toggleMansionListDrawer()" aria-label="一覧を閉じる" class="text-emerald-100 hover:text-white p-2">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- 検索窓 ＆ 該当数・並べ替え・更新エリア -->
      <div class="p-3 bg-slate-50/90 border-b border-slate-200 flex flex-col gap-2 shrink-0">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="mansionSearchInput" oninput="debouncedSearchInput()" placeholder="マンション名・住所・エリアで検索..." class="w-full pl-8 pr-3 py-2 text-xs bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#13685e] focus:border-transparent text-slate-700 shadow-sm">
        </div>
        <div class="flex items-center justify-between gap-2 text-xs text-slate-600 px-1 pt-0.5 btn-touch-ui">
          <div class="whitespace-nowrap">該当数: <span id="mansionSearchCount" class="font-bold text-slate-900">0</span> 件</div>
          <div class="flex items-center gap-2">
            <button type="button" id="btnSortDistance" onclick="toggleSortByDistance()" class="px-2.5 py-1 rounded-full text-[11px] font-bold border transition flex items-center gap-1 bg-white text-slate-600 border-slate-300">
              <i class="fas fa-sort text-[10px]"></i>
              <span>近い順</span>
            </button>
            <button onclick="loadMansionData()" class="text-[#13685e] hover:text-[#0a3f39] font-semibold flex items-center gap-1 transition">
              <i class="fas fa-sync-alt text-xs"></i>
              <span>更新</span>
            </button>
          </div>
        </div>
      </div>

      <div id="drawerContent" class="flex-1 overflow-y-auto p-3 space-y-2">
        <!-- JSで動的挿入 -->
      </div>
    </div>
  </main>

  <!-- ルート案内シート（地図アプリへ移動） -->
  <div id="routeSheet" class="hidden fixed inset-0 z-[10002] bg-slate-950/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 btn-touch-ui" onclick="closeRouteSheet()">
    <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-100 p-5 sm:p-6 pb-7">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-slate-800 font-bold text-lg">
          <i class="fas fa-route text-emerald-600"></i>
          <span>ルート案内</span>
        </div>
        <button type="button" onclick="closeRouteSheet()" aria-label="閉じる" class="text-slate-400 hover:text-slate-600 p-2 rounded-full hover:bg-slate-100 transition">
          <i class="fas fa-times text-lg"></i>
        </button>
      </div>

      <div class="mb-4 p-3 bg-slate-50 rounded-2xl border border-slate-200">
        <div id="routeMansionName" class="font-bold text-sm text-slate-900 leading-tight"></div>
        <div id="routeMansionAddr" class="text-xs text-slate-500 mt-1 leading-tight"></div>
        <div id="routeDistance" class="hidden text-xs text-[#13685e] font-semibold mt-1.5"></div>
      </div>

      <div class="text-[11px] font-bold text-slate-500 mb-1.5">移動手段</div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button type="button" id="route-mode-walking" onclick="setRouteMode('walking')" class="px-2 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5">
          <i class="fas fa-person-walking"></i><span>徒歩</span>
        </button>
        <button type="button" id="route-mode-driving" onclick="setRouteMode('driving')" class="px-2 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5">
          <i class="fas fa-car"></i><span>車</span>
        </button>
        <button type="button" id="route-mode-bicycling" onclick="setRouteMode('bicycling')" class="px-2 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5">
          <i class="fas fa-bicycle"></i><span>自転車</span>
        </button>
      </div>

      <div class="flex flex-col gap-2.5">
        <a id="routeGoogleLink" href="#" target="_blank" rel="noopener noreferrer"
          class="w-full py-3.5 bg-[#13685e] hover:bg-[#0e524a] active:bg-[#0a3f39] font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-sm no-underline"
          style="color:#ffffff !important;">
          <i class="fab fa-google text-xs" style="color:#ffffff !important;"></i>
          <span style="color:#ffffff !important;">Googleマップで開く</span>
        </a>
        <a id="routeAppleLink" href="#" target="_blank" rel="noopener noreferrer"
          class="hidden w-full py-3.5 bg-white border border-slate-300 hover:bg-slate-50 active:bg-slate-100 font-bold rounded-2xl transition flex items-center justify-center gap-2 text-sm no-underline"
          style="color:#1e293b !important;">
          <i class="fab fa-apple text-sm" style="color:#1e293b !important;"></i>
          <span style="color:#1e293b !important;">Appleマップで開く</span>
        </a>
        <p id="routeAppleHint" class="hidden text-[11px] text-slate-500 text-center leading-snug">
          自転車ルートはGoogleマップでご利用ください。
        </p>
      </div>

      <p class="text-[11px] text-slate-400 mt-3 leading-snug">
        現在地から目的地までのルートが地図アプリに表示されます。位置情報の許可を求められた場合は許可してください。
      </p>
    </div>
  </div>

  <!-- 報告モーダルダイアログ -->
  <div id="reportModal" class="hidden fixed inset-0 z-[10002] bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100 max-h-[92dvh] overflow-y-auto">
      <div class="p-5 sm:p-6 pb-2 flex items-center justify-between btn-touch-ui">
        <div class="flex items-center gap-2 text-slate-800 font-bold text-lg sm:text-xl">
          <i class="fas fa-pen-to-square text-emerald-600"></i>
          <span>報告</span>
        </div>
        <button type="button" onclick="closeReportModal()" aria-label="報告モーダルを閉じる" class="text-slate-400 hover:text-slate-600 p-2 rounded-full hover:bg-slate-100 transition">
          <i class="fas fa-times text-lg"></i>
        </button>
      </div>

      <form onsubmit="handleReportSubmit(event)" class="p-5 sm:p-6 pt-3 space-y-4">
        <div id="reportTargetBox" class="hidden p-3 bg-emerald-50 border border-emerald-200 rounded-2xl">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[11px] font-bold text-emerald-700 mb-0.5">対象マンション</div>
              <div id="reportTargetName" class="text-sm font-bold text-slate-900 leading-tight"></div>
              <div id="reportTargetAddr" class="text-xs text-slate-500 mt-0.5 leading-tight"></div>
            </div>
            <button type="button" onclick="clearReportTarget()" aria-label="対象マンションを外す" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-white shrink-0">
              <i class="fas fa-times text-xs"></i>
            </button>
          </div>
        </div>

        <div>
          <label for="reportName" class="block text-xs font-bold text-slate-700 mb-1.5">
            奉仕者名 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="reportName" required placeholder="奉仕者名を入力" class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#13685e] focus:border-transparent text-slate-800 placeholder-slate-400 shadow-sm transition">
        </div>

        <div>
          <label for="reportCategory" class="block text-xs font-bold text-slate-700 mb-1.5">
            項目を選択 <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <select id="reportCategory" onchange="handleReportCategoryChange()" required class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#13685e] focus:border-transparent text-slate-800 appearance-none shadow-sm transition cursor-pointer pr-10">
              <option value="" disabled selected>▼ 選択してください</option>
              <option value="新規マンション追加">新規マンション追加</option>
              <option value="登録情報の修正">登録情報の修正</option>
              <option value="訪問拒否情報">訪問拒否情報</option>
              <option value="外国人情報">外国人情報</option>
              <option value="その他">その他</option>
            </select>
            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-xs">
              <i class="fas fa-chevron-down"></i>
            </div>
          </div>
        </div>

        <div>
          <label for="reportDetails" class="block text-xs font-bold text-slate-700 mb-1.5">
            詳細内容
          </label>
          <textarea id="reportDetails" rows="3" placeholder="詳細を入力" class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#13685e] focus:border-transparent text-slate-800 placeholder-slate-400 shadow-sm transition resize-none"></textarea>
        </div>

        <button type="submit" id="reportSubmitBtn" class="w-full mt-2 py-3.5 bg-[#13685e] hover:bg-[#0e524a] active:bg-[#0a3f39] text-white font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-sm btn-touch-ui">
          <i class="fas fa-paper-plane text-xs"></i>
          <span>送信</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // セッション認証状態（サーバー検証後に保持）
    let userAuthPassword = "";

    let map = null;
    let markersLayer = null;
    let userMarker = null;
    let mansionMarkersMap = {};
    let mansionDataList = [];
    let watchPositionId = null;
    let userCoordinates = null;
    let currentAreaFilter = 'ALL';
    let searchKeyword = '';
    let isDrawerOpen = false;
    let searchDebounceTimer = null;
    let isPopupOpen = false;

    // 現在地ボタンのズーム
    const CURRENT_LOCATION_ZOOM = 16;

    // 近く表示・並べ替え
    const NEAR_RADIUS_M = 500;
    let nearMode = false;
    let sortByDistance = false;
    let nearCircle = null;
    let lastListCoords = null;

    // 報告の対象マンション
    let reportTarget = null;

    // ルート案内用の状態
    let routeTarget = null;
    let routeMode = 'walking';
    const ROUTE_MODE_KEY = 'konohana_route_mode';
    const VALID_ROUTE_MODES = ['walking', 'driving', 'bicycling'];

    try {
      const saved = localStorage.getItem(ROUTE_MODE_KEY);
      if (saved && VALID_ROUTE_MODES.includes(saved)) routeMode = saved;
    } catch (e) { /* 何もしない */ }

    // カラーパレット定義（16シート識別用）
    const sheetColors = [
      { bg: '#2563eb', text: '#ffffff', badgeBg: '#dbeafe', badgeText: '#1e40af' },
      { bg: '#dc2626', text: '#ffffff', badgeBg: '#fee2e2', badgeText: '#991b1b' },
      { bg: '#059669', text: '#ffffff', badgeBg: '#d1fae5', badgeText: '#065f46' },
      { bg: '#d97706', text: '#ffffff', badgeBg: '#fef3c7', badgeText: '#92400e' },
      { bg: '#7c3aed', text: '#ffffff', badgeBg: '#ede9fe', badgeText: '#5b21b6' },
      { bg: '#db2777', text: '#ffffff', badgeBg: '#fce7f3', badgeText: '#9d174d' },
      { bg: '#0891b2', text: '#ffffff', badgeBg: '#cffaff', badgeText: '#155e75' },
      { bg: '#65a30d', text: '#ffffff', badgeBg: '#ecfccb', badgeText: '#3f6212' },
      { bg: '#ea580c', text: '#ffffff', badgeBg: '#ffedd5', badgeText: '#9a3412' },
      { bg: '#4f46e5', text: '#ffffff', badgeBg: '#e0e7ff', badgeText: '#3730a3' },
      { bg: '#0284c7', text: '#ffffff', badgeBg: '#e0f2fe', badgeText: '#075985' },
      { bg: '#16a34a', text: '#ffffff', badgeBg: '#dcfce7', badgeText: '#166534' },
      { bg: '#9333ea', text: '#ffffff', badgeBg: '#f3e8ff', badgeText: '#6b21a8' },
      { bg: '#c026d3', text: '#ffffff', badgeBg: '#fae8ff', badgeText: '#86198f' },
      { bg: '#e11d48', text: '#ffffff', badgeBg: '#ffe4e6', badgeText: '#9f1239' },
      { bg: '#475569', text: '#ffffff', badgeBg: '#f1f5f9', badgeText: '#334155' }
    ];
    const sheetColorMap = {};
    let colorIndex = 0;

    const AREA_STYLES = {
      '此花区': { bg: '#2563eb', text: '#ffffff' },
      '福島区': { bg: '#7c3aed', text: '#ffffff' },
      'その他': { bg: '#64748b', text: '#ffffff' }
    };

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeUrl(url) {
      if (!url) return '';
      const trimmed = String(url).trim();
      return /^https?:\/\//i.test(trimmed) ? trimmed : '';
    }

    function getSheetColor(sheetName) {
      if (!sheetName) sheetName = 'その他';
      if (!sheetColorMap[sheetName]) {
        sheetColorMap[sheetName] = sheetColors[colorIndex % sheetColors.length];
        colorIndex++;
      }
      return sheetColorMap[sheetName];
    }

    function getAreaStyle(area) {
      return AREA_STYLES[area] || AREA_STYLES['その他'];
    }

    function buildAreaBadge(area) {
      const st = getAreaStyle(area);
      return `<span style="background-color: ${esc(st.bg)}; color: ${esc(st.text)};" class="px-2 py-0.5 rounded-full text-[10px] font-bold inline-block">${esc(area)}</span>`;
    }

    function findMansion(id) {
      return mansionDataList.find(m => m.id === id);
    }

    function calcDistanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2
        + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistance(meters) {
      if (meters < 1000) return Math.round(meters / 10) * 10 + ' m';
      return (meters / 1000).toFixed(1) + ' km';
    }

    function computeDistances() {
      mansionDataList.forEach(m => {
        m.distance = userCoordinates
          ? calcDistanceMeters(userCoordinates[0], userCoordinates[1], m.lat, m.lng)
          : null;
      });
    }

    function toggleNearMode() {
      if (!nearMode) {
        if (!userCoordinates) {
          showToast("現在地を取得中、またはGPSが不許可です", false);
          return;
        }
        nearMode = true;
      } else {
        nearMode = false;
      }
      updateNearCircle();
      updateNearUI();
      updateSortUI();
      renderMarkers(true);
      renderDrawerList();

      if (nearMode) {
        const n = getFilteredMansionList().length;
        showToast(n > 0 ? `現在地から${NEAR_RADIUS_M}m以内: ${n}件` : `半径${NEAR_RADIUS_M}m以内にマンションはありません`, false);
      }
    }

    function updateNearUI() {
      const btn = document.getElementById("header-tab-NEAR");
      if (!btn) return;
      btn.className = nearMode
        ? "px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-white bg-sky-600 border border-sky-600 shadow-sm whitespace-nowrap text-center shrink-0 flex items-center gap-1"
        : "px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-sky-800 bg-sky-50 border border-sky-200 whitespace-nowrap text-center shrink-0 flex items-center gap-1";
    }

    function updateNearCircle() {
      if (!map) return;
      if (nearMode && userCoordinates) {
        if (!nearCircle) {
          nearCircle = L.circle(userCoordinates, {
            radius: NEAR_RADIUS_M,
            color: '#0284c7',
            weight: 1.5,
            fillColor: '#0ea5e9',
            fillOpacity: 0.06,
            interactive: false
          }).addTo(map);
        } else {
          nearCircle.setLatLng(userCoordinates);
        }
      } else if (nearCircle) {
        map.removeLayer(nearCircle);
        nearCircle = null;
      }
    }

    function toggleSortByDistance() {
      if (nearMode) {
        showToast("「近く500m」の表示中は近い順に並びます", false);
        return;
      }
      if (!sortByDistance && !userCoordinates) {
        showToast("現在地を取得中、またはGPSが不許可です", false);
        return;
      }
      sortByDistance = !sortByDistance;
      updateSortUI();
      renderDrawerList();
    }

    function updateSortUI() {
      const btn = document.getElementById("btnSortDistance");
      if (!btn) return;
      const active = sortByDistance || nearMode;
      btn.className = active
        ? "px-2.5 py-1 rounded-full text-[11px] font-bold border transition flex items-center gap-1 bg-sky-600 text-white border-sky-600"
        : "px-2.5 py-1 rounded-full text-[11px] font-bold border transition flex items-center gap-1 bg-white text-slate-600 border-slate-300";
    }

    function onLocationUpdated() {
      if (!userCoordinates) return;
      const moved = !lastListCoords ||
        calcDistanceMeters(lastListCoords[0], lastListCoords[1], userCoordinates[0], userCoordinates[1]) > 50;
      if (!moved) return;
      lastListCoords = [userCoordinates[0], userCoordinates[1]];

      if (nearMode) {
        updateNearCircle();
        if (!isPopupOpen) renderMarkers(false);
      }
      if (isDrawerOpen) renderDrawerList(true);
    }

    function isIOSDevice() {
      const ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) return true;
      return (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function buildGoogleRouteUrl(m, mode) {
      return 'https://www.google.com/maps/dir/?api=1'
        + '&destination=' + m.lat + ',' + m.lng
        + '&travelmode=' + mode;
    }

    function buildAppleRouteUrl(m, mode) {
      const flagMap = { walking: 'w', driving: 'd' };
      return 'https://maps.apple.com/?daddr=' + m.lat + ',' + m.lng
        + '&dirflg=' + (flagMap[mode] || 'w');
    }

    function openRouteSheet(id) {
      const m = findMansion(id);
      if (!m || !isFinite(m.lat) || !isFinite(m.lng)) {
        showToast("このマンションの位置情報がありません", false);
        return;
      }
      routeTarget = m;
      closeHamburgerMenu();

      document.getElementById("routeMansionName").textContent = m.name || '';
      document.getElementById("routeMansionAddr").textContent = m.address || '住所未登録';

      const distEl = document.getElementById("routeDistance");
      if (userCoordinates) {
        const d = calcDistanceMeters(userCoordinates[0], userCoordinates[1], m.lat, m.lng);
        distEl.textContent = '現在地から直線で約 ' + formatDistance(d);
        distEl.classList.remove("hidden");
      } else {
        distEl.classList.add("hidden");
      }

      updateRouteSheetUI();
      document.getElementById("routeSheet").classList.remove("hidden");
    }

    function closeRouteSheet() {
      const sheet = document.getElementById("routeSheet");
      if (sheet) sheet.classList.add("hidden");
    }

    function setRouteMode(mode) {
      if (!VALID_ROUTE_MODES.includes(mode)) return;
      routeMode = mode;
      try { localStorage.setItem(ROUTE_MODE_KEY, mode); } catch (e) { /* 何もしない */ }
      updateRouteSheetUI();
    }

    function updateRouteSheetUI() {
      VALID_ROUTE_MODES.forEach(mode => {
        const btn = document.getElementById('route-mode-' + mode);
        if (!btn) return;
        btn.className = (mode === routeMode)
          ? "px-2 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5 bg-[#13685e] text-white border-[#13685e] shadow-sm"
          : "px-2 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-50";
      });

      const appleLink = document.getElementById("routeAppleLink");
      const appleHint = document.getElementById("routeAppleHint");
      const isIOS = isIOSDevice();
      if (appleLink) {
        if (isIOS && routeMode !== 'bicycling') appleLink.classList.remove("hidden");
        else appleLink.classList.add("hidden");
      }
      if (appleHint) {
        if (isIOS && routeMode === 'bicycling') appleHint.classList.remove("hidden");
        else appleHint.classList.add("hidden");
      }

      if (!routeTarget) return;
      const g = document.getElementById("routeGoogleLink");
      const a = document.getElementById("routeAppleLink");
      if (g) g.href = buildGoogleRouteUrl(routeTarget, routeMode);
      if (a) a.href = buildAppleRouteUrl(routeTarget, routeMode);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeRouteSheet();
        closeReportModal();
      }
    });

    function handleLogin(e) {
      if (e) e.preventDefault();
      const pwdInput = document.getElementById("passwordInput");
      const errDiv = document.getElementById("loginError");
      const errMsg = document.getElementById("loginErrorMsg");
      const submitBtn = document.getElementById("btnLoginSubmit");
      const pwd = pwdInput.value.trim();

      if (!pwd) return;

      submitBtn.disabled = true;
      document.getElementById("loginBtnText").textContent = "確認中...";

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            submitBtn.disabled = false;
            document.getElementById("loginBtnText").textContent = "ログイン";
            if (res && res.success) {
              if (errDiv) errDiv.classList.add("hidden");
              userAuthPassword = pwd;
              onLoginSuccess();
            } else {
              if (errDiv) errDiv.classList.remove("hidden");
              if (errMsg) errMsg.textContent = res ? res.error : "パスワードが正しくありません";
            }
          })
          .withFailureHandler((err) => {
            submitBtn.disabled = false;
            document.getElementById("loginBtnText").textContent = "ログイン";
            if (errDiv) errDiv.classList.remove("hidden");
            if (errMsg) errMsg.textContent = "通信エラーが発生しました";
          })
          .checkPassword(pwd);
      } else {
        const host = location.hostname;
        const isLocalTest = (host === 'localhost' || host === '127.0.0.1' || host === '');
        setTimeout(() => {
          submitBtn.disabled = false;
          document.getElementById("loginBtnText").textContent = "ログイン";
          if (isLocalTest && pwd.length > 0) {
            userAuthPassword = pwd;
            onLoginSuccess();
          } else {
            if (errDiv) errDiv.classList.remove("hidden");
            if (errMsg) errMsg.textContent = "このページはGASのWebアプリURLから開いてください";
          }
        }, 300);
      }
    }

    function onLoginSuccess() {
      document.getElementById("loginScreen").classList.add("hidden");

      const controls = document.getElementById("headerControls");
      const areaFilter = document.getElementById("headerAreaFilter");
      if (controls) {
        controls.classList.remove("hidden");
        controls.classList.add("flex");
      }
      if (areaFilter) {
        areaFilter.classList.remove("hidden");
        areaFilter.classList.add("flex");
      }

      setTimeout(() => {
        initMap();
        if (map) map.invalidateSize();
        loadMansionData();
        startLocationTracking();
      }, 100);
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById("passwordInput");
      const eyeIcon = document.getElementById("eyeIcon");
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
      } else {
        pwdInput.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
    }

    function logout() {
      closeHamburgerMenu();
      closeRouteSheet();
      closeReportModal();
      userAuthPassword = "";

      if (watchPositionId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(watchPositionId);
        watchPositionId = null;
      }
      if (userMarker && map) {
        map.removeLayer(userMarker);
        userMarker = null;
      }
      userCoordinates = null;
      lastListCoords = null;

      nearMode = false;
      sortByDistance = false;
      updateNearCircle();
      updateNearUI();
      updateSortUI();
      reportTarget = null;
      updateReportTargetUI();

      document.getElementById("passwordInput").value = "";
      document.getElementById("loginError").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("headerControls").classList.add("hidden");
      document.getElementById("headerAreaFilter").classList.add("hidden");
    }

    function toggleHamburgerMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById("hamburgerDropdown");
      if (menu) menu.classList.toggle("hidden");
    }

    function closeHamburgerMenu() {
      const menu = document.getElementById("hamburgerDropdown");
      if (menu && !menu.classList.contains("hidden")) {
        menu.classList.add("hidden");
      }
    }

    window.addEventListener('click', (e) => {
      const btn = document.getElementById("btnHamburger");
      const dropdown = document.getElementById("hamburgerDropdown");
      if (dropdown && !dropdown.classList.contains("hidden") && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
        closeHamburgerMenu();
      }
    });

    function openReportModal(id) {
      closeHamburgerMenu();
      reportTarget = null;
      if (typeof id === 'number') {
        const m = findMansion(id);
        if (m) reportTarget = m;
      }
      updateReportTargetUI();
      const modal = document.getElementById("reportModal");
      if (modal) modal.classList.remove("hidden");
    }

    function closeReportModal() {
      const modal = document.getElementById("reportModal");
      if (modal) modal.classList.add("hidden");
    }

    function clearReportTarget() {
      reportTarget = null;
      updateReportTargetUI();
    }

    function updateReportTargetUI() {
      const box = document.getElementById("reportTargetBox");
      if (!box) return;
      if (reportTarget) {
        document.getElementById("reportTargetName").textContent = reportTarget.name || '';
        document.getElementById("reportTargetAddr").textContent =
          (reportTarget.address || '住所未登録') + (reportTarget.sheetName ? '（' + reportTarget.sheetName + '）' : '');
        box.classList.remove("hidden");
      } else {
        box.classList.add("hidden");
      }
    }

    function handleReportCategoryChange() {
      const category = document.getElementById("reportCategory").value;
      const detailsInput = document.getElementById("reportDetails");
      if (!detailsInput) return;

      if (category === "新規マンション追加") {
        detailsInput.placeholder = "住所・マンション名・部屋番号を入力";
      } else {
        detailsInput.placeholder = "詳細を入力";
      }
    }

    function handleReportSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("reportSubmitBtn");
      const name = document.getElementById("reportName").value.trim();
      const category = document.getElementById("reportCategory").value;
      const details = document.getElementById("reportDetails").value.trim();

      if (!name || !category) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fas fa-circle-notch fa-spin text-xs"></i> <span>送信中...</span>`;

      const locationText = reportTarget
        ? [reportTarget.name, reportTarget.address, reportTarget.sheetName].filter(Boolean).join('｜')
        : '';

      const reportData = { reporterName: name, category: category, details: details, location: locationText };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fas fa-paper-plane text-xs"></i> <span>送信</span>`;
            if (res && res.success) {
              closeReportModal();
              showToast("報告を送信しました", false);
              document.getElementById("reportName").value = "";
              document.getElementById("reportCategory").value = "";
              document.getElementById("reportDetails").value = "";
              document.getElementById("reportDetails").placeholder = "詳細を入力";
              reportTarget = null;
              updateReportTargetUI();
            } else {
              showToast("送信失敗: " + (res ? res.error : "エラーが発生しました"), false);
            }
          })
          .withFailureHandler((err) => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fas fa-paper-plane text-xs"></i> <span>送信</span>`;
            showToast("通信エラー: " + (err.message || err.toString()), false);
          })
          .submitReport(reportData);
      } else {
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fas fa-paper-plane text-xs"></i> <span>送信</span>`;
          closeReportModal();
          showToast("報告を送信しました（テスト動作）", false);
          reportTarget = null;
          updateReportTargetUI();
        }, 600);
      }
    }

    function initMap() {
      if (map) return;
      map = L.map('map', { zoomControl: false }).setView([34.682, 135.452], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      map.on('popupopen', () => { isPopupOpen = true; });
      map.on('popupclose', () => { isPopupOpen = false; });
    }

    function loadMansionData() {
      showToast("データを読み込んでいます...", true);

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onDataLoaded)
          .withFailureHandler(onDataError)
          .getMansionData(userAuthPassword);
      } else {
        setTimeout(() => {
          onDataLoaded({
            success: true,
            data: [
              { id: 1, name: "サンプルプレサンス此花 (急ぎ)", address: "大阪市此花区四貫島1-1", roomLink: "https://example.com", lat: 34.682, lng: 135.452, sheetName: "フロタン", isUrgent: true },
              { id: 2, name: "福島グランドハイツ", address: "大阪市福島区海老江2-1", roomLink: "https://example.com", lat: 34.690, lng: 135.465, sheetName: "海老江", isUrgent: false }
            ]
          });
        }, 600);
      }
    }

    function onDataError(err) {
      console.error("GAS Execution Error: ", err);
      showToast("通信エラー: " + (err.message || err.toString()), false);
    }

    function onDataLoaded(res) {
      if (!res || !res.success) {
        showToast("データ取得失敗: " + (res ? res.error : "不明なエラー"), false);
        return;
      }

      mansionDataList = res.data || [];

      updateCountsUI();
      renderMarkers(true);
      renderDrawerList();
      showToast(`${mansionDataList.length}件のマンションを取得しました`, false);
    }

    function debouncedSearchInput() {
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        handleSearchInput();
      }, 300);
    }

    function handleSearchInput() {
      const input = document.getElementById("mansionSearchInput");
      searchKeyword = input ? input.value.trim().toLowerCase() : '';
      renderMarkers(false);
      renderDrawerList();
    }

    function getMansionArea(m) {
      if (m.address && m.address.includes('此花区')) return '此花区';
      if (m.address && m.address.includes('福島区')) return '福島区';
      if (m.sheetName && m.sheetName.includes('海老江')) return '福島区';
      return 'その他';
    }

    function isUrgentMansion(m) {
      if (typeof m.isUrgent === 'boolean') return m.isUrgent;
      return !!(m.name && (m.name.includes('急ぎ') || m.name.includes('優先')));
    }

    function getFilteredMansionList() {
      computeDistances();
      let list = mansionDataList;

      if (currentAreaFilter === '急ぎ・優先') {
        list = list.filter(m => isUrgentMansion(m));
      } else if (currentAreaFilter !== 'ALL') {
        list = list.filter(m => getMansionArea(m) === currentAreaFilter);
      }

      if (nearMode && userCoordinates) {
        list = list.filter(m => m.distance !== null && m.distance <= NEAR_RADIUS_M);
      }

      if (searchKeyword) {
        list = list.filter(m => {
          const name = (m.name || '').toLowerCase();
          const addr = (m.address || '').toLowerCase();
          const sheet = (m.sheetName || '').toLowerCase();
          const area = (getMansionArea(m) || '').toLowerCase();
          return name.includes(searchKeyword) || addr.includes(searchKeyword) || sheet.includes(searchKeyword) || area.includes(searchKeyword);
        });
      }

      if ((sortByDistance || nearMode) && userCoordinates) {
        list = list.slice().sort((a, b) => {
          const da = (a.distance === null || a.distance === undefined) ? Infinity : a.distance;
          const db = (b.distance === null || b.distance === undefined) ? Infinity : b.distance;
          return da - db;
        });
      }

      return list;
    }

    function updateCountsUI() {
      const countAll = mansionDataList.length;
      const countKonohana = mansionDataList.filter(m => getMansionArea(m) === '此花区').length;
      const countFukushima = mansionDataList.filter(m => getMansionArea(m) === '福島区').length;
      const countUrgent = mansionDataList.filter(m => isUrgentMansion(m)).length;

      const elAll = document.getElementById('count-ALL');
      const elKonohana = document.getElementById('count-此花区');
      const elFukushima = document.getElementById('count-福島区');
      const elUrgent = document.getElementById('count-急ぎ・優先');

      if (elAll) elAll.textContent = `(${countAll})`;
      if (elKonohana) elKonohana.textContent = `(${countKonohana})`;
      if (elFukushima) elFukushima.textContent = `(${countFukushima})`;
      if (elUrgent) elUrgent.textContent = `(${countUrgent})`;
    }

    function setAreaFilter(area) {
      currentAreaFilter = area;
      updateFilterUI();
      renderMarkers(true);
      renderDrawerList();
    }

    function updateFilterUI() {
      const filters = ['ALL', '此花区', '福島区', '急ぎ・優先'];
      filters.forEach(f => {
        const btn = document.getElementById(`header-tab-${f}`);
        if (!btn) return;
        const isActive = (f === currentAreaFilter);

        if (f === '急ぎ・優先') {
          btn.className = isActive
            ? "header-filter-btn px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-[#854d0e] bg-[#fef3c7] border border-[#fde68a] shadow-sm whitespace-nowrap text-center shrink-0 flex items-center gap-1"
            : "header-filter-btn px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-[#854d0e] bg-[#fef3c7]/60 hover:bg-[#fef3c7] whitespace-nowrap text-center shrink-0 flex items-center gap-1";
        } else {
          btn.className = isActive
            ? "header-filter-btn px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all text-white bg-[#1e293b] shadow-sm whitespace-nowrap text-center shrink-0"
            : "header-filter-btn px-2 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-semibold transition-all text-slate-600 bg-[#edf2f4] hover:bg-slate-200 whitespace-nowrap text-center shrink-0";
        }
      });
    }

    function buildPinIcon(m) {
      const color = getSheetColor(m.sheetName);
      const isUrgent = isUrgentMansion(m);

      const urgentBadge = isUrgent ? `
        <div style="position: absolute; top: -5px; right: -5px; background: linear-gradient(135deg, #f59e0b, #dc2626); color: #ffffff; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 2px solid #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10;">
          <i class="fas fa-fire"></i>
        </div>
      ` : '';

      const urgentPulseHtml = isUrgent ? `<div class="urgent-pin-pulse"></div>` : '';

      const pinHtml = `
        <div class="custom-mansion-pin" style="position: relative; display: flex; align-items: center; justify-content: center;">
          ${urgentPulseHtml}
          <div style="background-color: ${color.bg}; color: ${color.text}; width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #ffffff; position: relative; z-index: 1;">
            <i class="fas fa-building" style="transform: rotate(45deg); font-size: 13px;"></i>
          </div>
          ${urgentBadge}
        </div>
      `;

      return L.divIcon({
        className: 'mansion-pin-icon',
        html: pinHtml,
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });
    }

    function buildPopupContent(m) {
      const color = getSheetColor(m.sheetName);
      const isUrgent = isUrgentMansion(m);
      const validRoomLink = safeUrl(m.roomLink);

      const roomBtn = validRoomLink
        ? `<a href="${esc(validRoomLink)}" target="_blank" rel="noopener noreferrer" class="room-link-btn mt-2 inline-flex items-center justify-center w-full px-4 py-2.5 bg-[#13685e] hover:bg-[#0e524a] active:bg-[#0a3f39] !text-white font-bold rounded-2xl text-xs transition shadow-sm gap-2 no-underline shrink-0" style="color: #ffffff !important;">
            <span style="color: #ffffff !important;">部屋番号一覧を見る</span>
            <i class="fas fa-external-link-alt text-[10px]" style="color: #ffffff !important;"></i>
           </a>`
        : `<div class="mt-2 pb-1 text-xs text-slate-400 italic">リンク未登録</div>`;

      const routeBtn = `
        <button type="button" onclick="openRouteSheet(${Number(m.id)})"
          class="mt-2 inline-flex items-center justify-center w-full px-4 py-2.5 bg-white border-2 border-[#13685e] text-[#13685e] font-bold rounded-2xl text-xs transition gap-2 shrink-0 hover:bg-emerald-50 active:bg-emerald-100">
          <i class="fas fa-route text-[11px]"></i>
          <span>ルート案内（地図アプリで開く）</span>
        </button>`;

      const reportBtn = `
        <button type="button" onclick="openReportModal(${Number(m.id)})"
          class="mt-2 inline-flex items-center justify-center w-full px-3 py-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 font-semibold rounded-xl text-[11px] transition gap-1.5">
          <i class="fas fa-pen-to-square text-[10px]"></i>
          <span>このマンションについて報告</span>
        </button>`;

      const urgentPopupTag = isUrgent ? `
        <span class="bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
          <i class="fas fa-fire text-amber-600"></i> 急ぎ・優先
        </span>
      ` : '';

      const distTag = (m.distance !== null && m.distance !== undefined) ? `
        <span class="bg-sky-50 text-sky-700 border border-sky-200 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
          <i class="fas fa-location-arrow text-[9px]"></i> ${esc(formatDistance(m.distance))}
        </span>
      ` : '';

      return `
        <div class="popup-inner-wrapper min-w-[220px]">
          <div class="mb-1.5 flex items-center gap-1 flex-wrap">
            ${buildAreaBadge(getMansionArea(m))}
            <span style="background-color: ${esc(color.badgeBg)}; color: ${esc(color.badgeText)};" class="px-2 py-0.5 rounded-full text-[10px] font-bold inline-block">
              ${esc(m.sheetName)}
            </span>
            ${urgentPopupTag}
            ${distTag}
          </div>
          <h4 class="font-bold text-slate-900 text-sm mb-1 leading-tight">${esc(m.name)}</h4>
          <p class="text-xs text-slate-600 flex items-start gap-1 my-1 mb-2">
            <i class="fas fa-location-dot text-slate-400 mt-0.5 shrink-0"></i>
            <span class="leading-tight">${esc(m.address || '住所未登録')}</span>
          </p>
          ${roomBtn}
          ${routeBtn}
          ${reportBtn}
        </div>
      `;
    }

    function renderMarkers(shouldFitBounds = false) {
      if (!map || !markersLayer) return;

      markersLayer.clearLayers();
      mansionMarkersMap = {};

      const filteredList = getFilteredMansionList();
      const bounds = [];

      filteredList.forEach(m => {
        const marker = L.marker([m.lat, m.lng], { icon: buildPinIcon(m) });
        marker.bindPopup(buildPopupContent(m), {
          autoPanPaddingTopLeft: L.point(20, 85),
          autoPanPaddingBottomRight: L.point(20, 20)
        });
        markersLayer.addLayer(marker);

        mansionMarkersMap[m.id] = marker;
        bounds.push([m.lat, m.lng]);
      });

      if (nearMode && userCoordinates) {
        bounds.push([userCoordinates[0], userCoordinates[1]]);
      }

      if (shouldFitBounds && bounds.length > 0) {
        if (bounds.length === 1) {
          map.setView(bounds[0], 16);
        } else {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: nearMode ? 17 : 16 });
        }
      }
    }

    function renderDrawerList(preserveScroll = false) {
      const container = document.getElementById("drawerContent");
      const countEl = document.getElementById("mansionSearchCount");
      if (!container) return;

      const prevScroll = container.scrollTop;
      const filteredList = getFilteredMansionList();
      if (countEl) countEl.textContent = filteredList.length;

      if (filteredList.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-400 text-xs">
            <i class="fas fa-search-minus text-2xl mb-2 text-slate-300"></i>
            <p>${nearMode ? '半径' + NEAR_RADIUS_M + 'm以内にマンションはありません' : '該当するマンションが見つかりません'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredList.map(m => {
        const color = getSheetColor(m.sheetName);
        const area = getMansionArea(m);
        const isUrgent = isUrgentMansion(m);

        const urgentCardBadge = isUrgent ? `
          <span class="bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded-full text-[10px] font-bold flex items-center gap-1">
            <i class="fas fa-fire text-amber-600"></i> 急ぎ・優先
          </span>
        ` : '';

        const distBadge = (m.distance !== null && m.distance !== undefined) ? `
          <span class="ml-auto bg-sky-50 text-sky-700 border border-sky-200 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
            <i class="fas fa-location-arrow text-[9px]"></i>${esc(formatDistance(m.distance))}
          </span>
        ` : '';

        const validRoomLink = safeUrl(m.roomLink);

        const routeBtn = `
          <button type="button" onclick="event.stopPropagation(); openRouteSheet(${Number(m.id)})"
            class="inline-flex items-center justify-center px-3 py-2 bg-white border border-[#13685e] text-[#13685e] font-bold rounded-xl text-xs transition gap-1.5 hover:bg-emerald-50 active:bg-emerald-100">
            <i class="fas fa-route text-[10px]"></i>
            <span>ルート案内</span>
          </button>`;

        const roomBtn = validRoomLink
          ? `<a href="${esc(validRoomLink)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="inline-flex items-center justify-center px-3 py-2 bg-[#13685e] hover:bg-[#0e524a] text-white font-bold rounded-xl text-xs transition shadow-sm gap-1.5 no-underline">
              <span>部屋番号一覧</span>
              <i class="fas fa-external-link-alt text-[10px]"></i>
             </a>`
          : '';

        const reportBtn = `
          <button type="button" onclick="event.stopPropagation(); openReportModal(${Number(m.id)})"
            class="inline-flex items-center justify-center px-3 py-2 bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 font-bold rounded-xl text-xs transition gap-1.5">
            <i class="fas fa-pen-to-square text-[10px]"></i>
            <span>報告</span>
          </button>`;

        const noLinkNote = validRoomLink ? '' : `<div class="text-[11px] text-slate-400 italic">リンク未登録</div>`;

        return `
          <div onclick="focusMansionOnMap(${Number(m.id)})" class="p-3 bg-white hover:bg-emerald-50/40 rounded-2xl border ${isUrgent ? 'border-amber-300 ring-1 ring-amber-200' : 'border-slate-200'} shadow-sm transition cursor-pointer flex flex-col gap-1 relative overflow-hidden">
            <div class="flex items-center gap-1.5 flex-wrap">
              ${buildAreaBadge(area)}
              <span style="background-color: ${esc(color.badgeBg)}; color: ${esc(color.badgeText)};" class="px-2 py-0.5 rounded-full text-[10px] font-bold">
                ${esc(m.sheetName)}
              </span>
              ${urgentCardBadge}
              ${distBadge}
            </div>
            <h4 class="font-bold text-slate-900 text-sm mt-0.5 flex items-center gap-1.5">
              <span>${esc(m.name)}</span>
            </h4>
            <p class="text-xs text-slate-500 flex items-center gap-1 mb-1">
              <i class="fas fa-location-dot text-slate-400 shrink-0"></i>
              <span>${esc(m.address || '住所未登録')}</span>
            </p>
            <div class="grid ${validRoomLink ? 'grid-cols-2' : 'grid-cols-1'} gap-2 mt-1">
              ${routeBtn}
              ${roomBtn}
            </div>
            ${noLinkNote}
            <div class="grid grid-cols-1 gap-2">
              ${reportBtn}
            </div>
          </div>
        `;
      }).join('');

      if (preserveScroll) container.scrollTop = prevScroll;
    }

    function focusMansionOnMap(id) {
      const mansion = findMansion(id);
      if (!mansion || !map) return;

      if (window.innerWidth < 640) {
        if (isDrawerOpen) toggleMansionListDrawer();
      }

      map.setView([mansion.lat, mansion.lng], 17);
      const marker = mansionMarkersMap[id];
      if (marker) {
        marker.openPopup();
      }
    }

    function toggleMansionListDrawer() {
      const drawer = document.getElementById("listDrawer");
      const btnList = document.getElementById("btnList");
      if (!drawer) return;

      isDrawerOpen = !isDrawerOpen;

      if (isDrawerOpen) {
        drawer.classList.remove("translate-x-full");
        if (btnList) {
          btnList.innerHTML = `<i class="fas fa-map text-xs"></i><span>地図</span>`;
        }
        renderDrawerList();
      } else {
        drawer.classList.add("translate-x-full");
        if (btnList) {
          btnList.innerHTML = `<i class="fas fa-list text-xs"></i><span>一覧</span>`;
        }
      }
    }

    function startLocationTracking() {
      if (!navigator.geolocation) {
        showToast("お使いの端末はGPSに対応していません", false);
        return;
      }
      if (watchPositionId !== null) return;

      watchPositionId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          userCoordinates = [lat, lng];

          if (!userMarker && map) {
            const userIcon = L.divIcon({
              className: 'user-location-marker',
              html: `<div class="user-location-pulse"></div><div class="user-location-dot"></div>`,
              iconSize: [38, 38],
              iconAnchor: [19, 19]
            });

            userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
            userMarker.bindPopup('<div style="padding-right:32px; font-weight:700; font-size:14px; color:#1e293b;">現在地</div>');
          } else if (userMarker) {
            userMarker.setLatLng([lat, lng]);
          }

          onLocationUpdated();
        },
        (err) => {
          console.warn("GPS Location error: ", err);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 2000
        }
      );
    }

    function moveToCurrentLocation() {
      if (userCoordinates && map) {
        map.setView(userCoordinates, CURRENT_LOCATION_ZOOM);
        if (userMarker) userMarker.openPopup();
        showToast("現在地に移動しました", false);
      } else {
        showToast("現在地を取得中、またはGPSが不許可です", false);
      }
    }

    function showToast(message, isSpinning = false) {
      const toast = document.getElementById("statusToast");
      const text = document.getElementById("statusText");
      const spinner = document.getElementById("statusSpinner");

      if (!toast || !text) return;

      text.textContent = message;
      if (spinner) {
        if (isSpinning) spinner.classList.remove("hidden");
        else spinner.classList.add("hidden");
      }

      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");

      if (!isSpinning) {
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 3000);
      }
    }
  </script>
</body>
</html>
